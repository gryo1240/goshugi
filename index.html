<style>
/* ===== 2026-09-28 刷新:「袱紗（ふくさ）と中袋」 =====
   見せ場は1つ: 相場の結果を、開いた袱紗の上に置いた中袋として組む。金額は中袋の金額欄に。
   袱紗の色はタブで替える（お祝い=臙脂・香典=紺・知識と設定=慶弔兼用の紫）。香典の金額は薄墨の色。
   香典タブには紅白・金・のしなど祝い物の飾りを一切出さない。絵文字は使わない */
:root{
  --bg:#F5F2EB; --surface:#FDFBF6; --ink:#2F2A22; --muted:#6E6656;
  --line:#DDD5C4; --accent:#7B2733; --accent-ink:#FFFFFF; --accent-soft:#F1E4E3;
  --warn:#9A3B2A; --warn-soft:#F5E6DF; --chip:#ECE6D9; --ok:#3E7A52; --okbg:#E5F0E9;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --fukusa:#7B2733; --fukusa2:#6A1F2A; --amt:#7B2733; --amtline:#B98A8F;
  --shadow:none;
}
body[data-mode="kouden"]{ --fukusa:#2D3850; --fukusa2:#252E43; --amt:#5E5E5E; --amtline:#A7A7A7; --accent:#2D3850; --accent-soft:#E4E7EE; }
body[data-mode="know"], body[data-mode="settings"]{ --fukusa:#56416F; --fukusa2:#48365E; --accent:#56416F; --accent-soft:#ECE7F1; }
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A1714; --surface:#24201B; --ink:#ECE6D9; --muted:#A99F8B;
    --line:#3D3728; --accent:#D9868F; --accent-ink:#2A0E12; --accent-soft:#3A2528;
    --warn:#D69073; --warn-soft:#3A2A21; --chip:#332D20; --ok:#7FBE97; --okbg:#233A2C;
  }
  body[data-mode="kouden"]{ --accent:#9FB0D6; --accent-soft:#262C3A; }
  body[data-mode="know"], body[data-mode="settings"]{ --accent:#BCA7D8; --accent-soft:#2F2838; }
  /* 暗い地では袱紗の濃い色の塗りが沈むので、選んだボタンは明るい色で塗る */
  .seg button.on{background:var(--accent); color:#1A1714; border-color:var(--accent);}
}
:root[data-theme="light"]{
  --bg:#F5F2EB; --surface:#FDFBF6; --ink:#2F2A22; --muted:#6E6656;
  --line:#DDD5C4; --accent:#7B2733; --accent-ink:#FFFFFF; --accent-soft:#F1E4E3;
  --warn:#9A3B2A; --warn-soft:#F5E6DF; --chip:#ECE6D9;
}
:root[data-theme="dark"]{
  --bg:#1A1714; --surface:#24201B; --ink:#ECE6D9; --muted:#A99F8B;
  --line:#3D3728; --accent:#D9868F; --accent-ink:#2A0E12; --accent-soft:#3A2528;
  --warn:#D69073; --warn-soft:#3A2A21; --chip:#332D20;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-wrap:break-word;}
#app{max-width:720px; margin:0 auto; padding:0 14px 84px;}
header.top{position:sticky; top:0; z-index:20; background:var(--bg);
  padding:12px 2px 9px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--ink);}
header.top h1{font-family:var(--mincho); font-size:18px; font-weight:700; letter-spacing:.08em;}
header.top .sub{color:var(--muted); font-size:13px; margin-left:auto; letter-spacing:.1em;}
main{padding-top:12px;}
h2{font-family:var(--mincho); font-size:15px; font-weight:700; letter-spacing:.06em; margin:18px 0 8px;}
.small{font-size:12.5px; color:var(--muted);}
.card{background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:12px 14px; margin-bottom:10px;}
button{font:inherit; cursor:pointer; border:none; border-radius:2px; padding:8px 14px; background:var(--chip); color:var(--ink);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:30; background:var(--surface); border-top:1px solid var(--ink); display:flex; justify-content:center;}
nav.tabs .inner{display:flex; width:100%; max-width:720px;}
nav.tabs button{flex:1; background:none; border-radius:0; padding:9px 0 11px; font-size:11.5px; color:var(--muted); display:flex; flex-direction:column; gap:3px; align-items:center;}
nav.tabs button.on{color:var(--accent); font-weight:700;}
/* 線のアイコン */
.ic{display:inline-block; width:20px; height:20px; background:currentColor; flex:none; -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat;}
@supports not ((mask-image:none) or (-webkit-mask-image:none)){ .ic{display:none;} }
.ic-env{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><rect x='6' y='3' width='12' height='18' rx='1'/><path d='M6 10h12'/><path d='M10 14h4'/></svg>");}
.ic-env2{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><rect x='6' y='3' width='12' height='18' rx='1'/><path d='M12 7v10'/></svg>");}
.ic-book{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><path d='M4 5.5c3-1.5 5.5-1.5 8 0v14c-2.5-1.5-5-1.5-8 0z'/><path d='M20 5.5c-3-1.5-5.5-1.5-8 0v14c2.5-1.5 5-1.5 8 0z'/></svg>");}
.ic-gear{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round'><circle cx='12' cy='12' r='3.2'/><path d='M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1'/></svg>");}
.f-row{margin:11px 0;}
.f-row:first-child{margin-top:0;}
.f-row .lbl{font-size:12.5px; color:var(--muted); font-weight:700; letter-spacing:.05em; margin-bottom:5px;}
.seg{display:flex; flex-wrap:wrap; gap:6px;}
.seg button{padding:5px 11px; font-size:13px; border:1px solid var(--line); background:var(--surface); border-radius:2px;}
.seg button.on{background:var(--fukusa); color:#fff; border-color:var(--fukusa); font-weight:700;}
/* ---- 袱紗（布）と中袋（紙） ---- */
.result{position:relative; text-align:center; padding:8px 6px; border:none;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px),
    linear-gradient(160deg, var(--fukusa), var(--fukusa2));}
/* 包んでいた布の角（左上に折り返し） */
.result::before{content:""; position:absolute; left:0; top:0; width:22px; height:22px;
  background:linear-gradient(135deg, var(--bg) 0 50%, rgba(255,255,255,.14) 50% 100%);}
.naka{position:relative; background:#FFFDF8; color:#2F2A22; border:1px solid #D9D1BF; padding:10px 9px 8px;
  box-shadow:0 1px 0 rgba(0,0,0,.25);}
.result .lb{font-size:12.5px; color:#6E6656;}
/* 中袋の金額欄 */
.result .amt{display:inline-block; font-family:var(--mincho); font-size:28px; font-weight:700; color:var(--amt); letter-spacing:.06em; line-height:1.35;
  margin:6px 0 2px; padding:1px 16px; border:3px double var(--amtline);}
.result .note{font-size:13px; margin-top:4px; color:#4A4336;}
.chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px;}
.chip{display:inline-block; font-size:12.5px; padding:4px 11px; border-radius:2px; background:var(--accent-soft); color:var(--ink); font-weight:600;}
.mannerbox{margin-top:8px; text-align:left; border-top:1px solid #2F2A22;}
.mannerbox .mrow{display:flex; gap:8px; padding:5px 0; border-bottom:1px dotted #CFC6B3; font-size:13.5px; line-height:1.55;}
.mannerbox .mrow:last-child{border-bottom:none;}
.mannerbox .mk{flex:0 0 6em; color:#6E6656; font-weight:700; font-size:12.5px; font-family:var(--mincho);}
.mannerbox .small{color:#6E6656;}
.warnbox{background:transparent; border:1px solid var(--warn); border-left-width:4px; border-radius:0; padding:7px 10px; font-size:13px; margin-top:8px; text-align:left; color:#2F2A22;}
.warnbox b{color:var(--warn);}
.naka .warnbox{--warn:#9A3B2A;}
/* 香典では赤みのある色を使わない（注意書きの枠も墨色） */
body[data-mode="kouden"] .naka .warnbox{--warn:#3F3F3F;}
details{margin-top:6px;}
details summary{cursor:pointer; font-size:13.5px; padding:4px 0; font-weight:700; font-family:var(--mincho);}
.article h4{font-size:14px; margin:9px 0 3px; font-family:var(--mincho);}
.article p,.article li{font-size:13.5px; line-height:1.55;}
.card.article{margin-bottom:9px;}
.nw{white-space:nowrap;}
.article ul,.article ol{padding-left:1.4em;}
.article table{border-collapse:collapse; margin:6px 0; font-size:13px; width:100%;}
.article th,.article td{border:1px solid var(--line); padding:4px 8px; text-align:left;}
.article td:last-child{font-family:var(--mincho);}
/* いちばん狭い幅では紙面の左右を詰めて、文節で折れる分の行の増えを吸収する */
@media (max-width:320px){ .card:not(.result){padding-left:10px; padding-right:10px;} }
@media (forced-colors: active){ .ic{forced-color-adjust:none; background:ButtonText;} nav.tabs button.on .ic{background:Highlight;} }
@media (forced-colors: active){
  .result{border:2px solid CanvasText;}
  .result::before{display:none;}
  .seg button.on{forced-color-adjust:none; background:Highlight; color:HighlightText;}
}
</style>

 <li>お札は<b>肖像画が裏・下</b>になる向きで入れる(悲しみでうつむく、の意)</li></ul>`},
 {t:"袱紗(ふくさ)の色と包み方",b:`<ul>
 <li><b>お祝い</b> → 赤・えんじ・金などの<b>暖色系</b>。右開きになるように包む</li>
 <li><b>お悔やみ</b> → 紺・緑・グレーなどの<b>寒色系</b>。左開きになるように包む</li>
 <li><b>紫はどちらにも使える</b>万能色。1枚持つなら紫がおすすめ</li>
 <li>受付では袱紗から出し、<b>相手から文字が読める向き</b>に回して両手で渡す</li></ul>`},
 {t:"中袋の書き方 — 金額は旧字体(大字)で",b:`<p>中袋の表の中央に金額、裏の左下に住所・氏名を書きます。金額は改ざん防止の意味で旧字体(大字)を使うのが正式です。</p>
 <table><tr><th>金額</th><th>書き方</th></tr>
 <tr><td>5千円</td><td>金伍仟円 / 金伍阡円</td></tr>
 <tr><td>1万円</td><td>金壱萬円</td></tr>
 <tr><td>3万円</td><td>金参萬円</td></tr>
 <tr><td>5万円</td><td>金伍萬円</td></tr>
 <tr><td>10万円</td><td>金拾萬円 / 金什萬円</td></tr></table>
 <p>最後に「也」をつける(金参萬円也)のはより丁寧な形。つけなくても失礼にはなりません。</p>`},
 {t:"香典の表書きは「薄墨」で",b:`<ul>
 <li>香典の表書きは<b>薄墨の筆ペン</b>で書くのが正式(「涙で墨が薄まった」の意)。四十九日以降の法要は濃い墨に戻す</li>
 <li>お祝いは<b>濃い墨</b>ではっきりと書く</li>
 <li>名前はフルネームで水引の下・中央に。夫婦連名は夫を右、妻を左に</li>
 <li>会社の連名は<b>3名まで</b>が目安。右から目上の順に書き、4名以上は<span class="nw">「◯◯一同」</span>+全員の名前を書いた紙を中に入れる</li></ul>`},
 {t:"渡し方と当日のふるまい",b:`<h4>結婚式</h4>
 <ul><li>受付で「本日はおめでとうございます」と一言添えて両手で渡す</li>
 <li>袱紗から出して、相手が読める向きに回してから</li></ul>
 <h4>お通夜・葬儀</h4>
 <ul><li>受付で「このたびはご愁傷さまです」と小声で。長々と話さないのが配慮</li>
 <li>通夜と葬儀の両方に参列する場合、香典は<b>どちらか一度だけ</b>(二度は「不幸が重なる」を連想させる)</li>
 <li>どうしても参列できない時は、弔電や現金書留(香典袋に入れて)で気持ちを届ける</li></ul>`}
];

/* ============ 状態(選択はページ内のみ・保存しない完全ステートレス設計) ============ */
const $=s=>document.querySelector(s);
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let iwaiSel={ev:"wed", rel:0, age:1};
let koudenSel={rel:5, age:1, rel2:"unknown"};

/* ============ お祝いタブ ============ */
function renderIwai(){
  const el=$("#tab-iwai");
  const ev=IWAI_EVENTS.find(e=>e.id===iwaiSel.ev);
  if(iwaiSel.rel>=ev.rel.length) iwaiSel.rel=0;
  const [relLabel, amounts]=ev.rel[iwaiSel.rel];
  const amount=amounts[iwaiSel.age];
  let html=`<div class="card">
    <div class="f-row"><div class="lbl">なんのお祝い?</div>
      <div class="seg" id="evSeg">${IWAI_EVENTS.map(e=>`<button data-v="${e.id}" class="${iwaiSel.ev===e.id?"on":""}">${esc(e.label)}</button>`).join("")}</div></div>
    <div class="f-row"><div class="lbl">相手との関係は?</div>
      <div class="seg" id="relSeg">${ev.rel.map((r,i)=>`<button data-v="${i}" class="${iwaiSel.rel===i?"on":""}">${esc(r[0])}</button>`).join("")}</div></div>
    <div class="f-row" style="margin-bottom:0"><div class="lbl">あなたの年代は?</div>
      <div class="seg" id="ageSeg">${AGES.map((a,i)=>`<button data-v="${i}" class="${iwaiSel.age===i?"on":""}">${esc(a)}</button>`).join("")}</div></div>
  </div>`;
  html+=`<div class="card result"><div class="naka">
    <div class="lb">${esc(ev.label)} × ${esc(relLabel)} × ${esc(AGES[iwaiSel.age])} の相場</div>
    <div class="amt">${esc(amount)}</div>
    ${ev.note?`<div class="note small">${esc(ev.note)}</div>`:""}
    <div class="mannerbox">
      <div class="mrow"><span class="mk">袋・水引</span><span>${esc(ev.manner.fukuro)}</span></div>
      <div class="mrow"><span class="mk">表書き</span><span>${esc(ev.manner.omote)}</span></div>
      <div class="mrow"><span class="mk">お札</span><span>${esc(ev.manner.satsu)}</span></div>
      <div class="mrow"><span class="mk">袱紗(ふくさ)</span><span>${esc(ev.manner.fukusa)}</span></div>
      <div class="mrow"><span class="mk">メモ</span><span>${esc(ev.manner.chu)}</span></div>
    </div>
    ${ev.warn?`<div class="warnbox"><b>注意:</b> ${esc(ev.warn)}</div>`:""}
  </div></div>
  <p class="small">相場は一般的な目安です。地域やご家庭の慣習、おつき合いの深さを優先してください。</p>`;
  el.innerHTML=html;
  el.querySelectorAll("#evSeg button").forEach(b=>b.onclick=()=>{ iwaiSel.ev=b.dataset.v; iwaiSel.rel=0; renderIwai(); });
  el.querySelectorAll("#relSeg button").forEach(b=>b.onclick=()=>{ iwaiSel.rel=+b.dataset.v; renderIwai(); });
  el.querySelectorAll("#ageSeg button").forEach(b=>b.onclick=()=>{ iwaiSel.age=+b.dataset.v; renderIwai(); });
}

/* ============ 香典タブ ============ */
function renderKouden(){
  const el=$("#tab-kouden");
  const [relLabel, amounts]=KOUDEN_REL[koudenSel.rel];
  const amount=amounts[koudenSel.age];
  const rel=RELIGIONS.find(r=>r.id===koudenSel.rel2);
  let html=`<div class="card">
    <div class="f-row"><div class="lbl">亡くなった方との関係は?</div>
      <div class="seg" id="krelSeg">${KOUDEN_REL.map((r,i)=>`<button data-v="${i}" class="${koudenSel.rel===i?"on":""}">${esc(r[0])}</button>`).join("")}</div></div>
    <div class="f-row"><div class="lbl">あなたの年代は?</div>
      <div class="seg" id="kageSeg">${AGES.map((a,i)=>`<button data-v="${i}" class="${koudenSel.age===i?"on":""}">${esc(a)}</button>`).join("")}</div></div>
    <div class="f-row" style="margin-bottom:0"><div class="lbl">ご宗教は?(表書きが変わります)</div>
      <div class="seg" id="krel2Seg">${RELIGIONS.map(r=>`<button data-v="${r.id}" class="${koudenSel.rel2===r.id?"on":""}">${esc(r.label)}</button>`).join("")}</div></div>
  </div>`;
  html+=`<div class="card result"><div class="naka">
    <div class="lb">${esc(relLabel)} × ${esc(AGES[koudenSel.age])} の香典の相場</div>
    <div class="amt">${esc(amount)}</div>
    <div class="mannerbox">
      <div class="mrow"><span class="mk">表書き</span><span><b>${esc(rel.omote)}</b><br><span class="small">${esc(rel.note)}</span></span></div>
      <div class="mrow"><span class="mk">袋・水引</span><span>黒白(または双銀)の結び切り。関西など一部地域では黄白</span></div>
      <div class="mrow"><span class="mk">お札</span><span>旧札を使う(新札しかなければ折り目をつける)。肖像画を裏・下向きに</span></div>
      <div class="mrow"><span class="mk">筆記</span><span>薄墨の筆ペンで。名前はフルネームで水引の下に</span></div>
      <div class="mrow"><span class="mk">袱紗(ふくさ)</span><span>紺・グレーなど寒色系(紫は慶弔兼用)</span></div>
    </div>
    <div class="warnbox"><b>注意:</b> 「4」「9」のつく金額は避ける。通夜と葬儀の両方に参列する場合、香典はどちらか一度だけ。</div>
  </div></div>
  <p class="small">相場は一般的な目安です。地域の慣習や、故人・ご遺族とのおつき合いの深さを優先してください。会社関係は社内の慣例(連名など)の確認を。</p>`;
  el.innerHTML=html;
  el.querySelectorAll("#krelSeg button").forEach(b=>b.onclick=()=>{ koudenSel.rel=+b.dataset.v; renderKouden(); });
  el.querySelectorAll("#kageSeg button").forEach(b=>b.onclick=()=>{ koudenSel.age=+b.dataset.v; renderKouden(); });
  el.querySelectorAll("#krel2Seg button").forEach(b=>b.onclick=()=>{ koudenSel.rel2=b.dataset.v; renderKouden(); });
}

/* ============ マナー知識タブ ============ */
function renderKnow(){
  const el=$("#tab-know");
  el.innerHTML=`<p class="small" style="margin-bottom:8px">急なときに迷わないための基本マナーです。</p>`+
    ARTICLES.map((a,i)=>`<div class="card article"><details ${i===0?"open":""}><summary>${esc(a.t)}</summary>${a.b}</details></div>`).join("");
}

/* ============ 設定タブ ============ */
function renderSettings(){
  const el=$("#tab-settings");
  el.innerHTML=`
  <div class="card">
    <h2 style="margin-top:0">このアプリについて</h2>
    <p class="small">結婚式のご祝儀・お葬式の香典などの金額相場と基本マナーを、選ぶだけで確認できる早見表アプリです。</p>
    <p class="small" style="margin-top:6px">金額はいずれも<b>一般的なマナーとして広く共有されている目安</b>です。地域の慣習・ご家庭の考え方・おつき合いの深さによって変わりますので、迷ったら身近な年長者や職場の慣例に合わせてください。</p>
    <p class="small" style="margin-top:6px">このアプリは何も入力・保存しません。外部への送信もなく、一度開けばオフラインでも使えます。</p>
  </div>
  `;
}

/* ============ タブ・起動 ============ */
let tab="iwai";
document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click",()=>{ tab=b.dataset.tab; render(); });
});
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  ["iwai","kouden","know","settings"].forEach(t=>{ $("#tab-"+t).hidden=(t!==tab); });
  document.body.dataset.mode=tab;   // 袱紗の色（お祝い=臙脂・香典=紺・ほか=紫）
  if(tab==="iwai") renderIwai();
  if(tab==="kouden") renderKouden();
  if(tab==="know") renderKnow();
  if(tab==="settings") renderSettings();
}
render();
</script>

if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
